<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f2efe5">
  <meta name="description"
    content="AgroConnect RJ: protótipo de vitrine para produtores rurais e consumidores do Rio de Janeiro.">
  <title>Vitrine | AgroConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script defer src="dados.js"></script>
  <script defer src="script.js"></script>
  <script defer src="vitrine.js"></script>
</head>

<body data-page="produtos">
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
  <div id="cabecalho-compartilhado"></div>
  <main id="conteudo">
    <div id="secao-catalogo">
      <section class="topo-pagina limite"><span class="sobrancelha">CATÁLOGO / 01</span>
        <h1>O que a terra oferece.</h1>
        <p>Explore anúncios demonstrativos de produtores situados em municípios do Rio de Janeiro.</p>
      </section>
      <section class="limite catalogo-layout" aria-label="Vitrine de produtos">
        <aside class="filtros">
          <h2>Procurar pela colheita</h2>
          <div class="campo"><label for="busca">Nome do alimento</label><input type="search" id="busca"
              placeholder="Ex.: cenoura" autocomplete="off"></div>
          <div class="campo"><label for="categoria">Categoria</label><select id="categoria">
              <option value="">Todas</option>
              <option>Frutas</option>
              <option>Legumes</option>
              <option>Verduras</option>
            </select></div>
          <div class="campo"><label for="cidade">Município do RJ</label><select id="cidade">
              <option value="">Todos</option>
              <option>Nova Friburgo</option>
              <option>Teresópolis</option>
              <option>Paty do Alferes</option>
              <option>São José de Ubá</option>
            </select></div><button type="button" id="limpar-filtros" class="botao botao-texto">Limpar filtros ↺</button>
        </aside>
        <div class="resultado-vitrine">
          <div class="resultado-cabeca">
            <h2>Produtos disponíveis <small>(simulação)</small></h2><output id="total-produtos"
              aria-live="polite"></output>
          </div>
          <div id="lista-produtos" class="grade-produtos" aria-live="polite"></div>
        </div>
      </section>
    </div>
    <section id="detalhe-produto" class="limite bloco" hidden aria-live="polite"></section>
  </main>
  <div id="rodape-compartilhado"></div>
</body>

</html>
